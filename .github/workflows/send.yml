# Sends queued emails and checks for replies every weekday, so your laptop doesn't need to be on.
# Setup: see "Running on a schedule (GitHub Actions)" in the README.
name: send

on:
  schedule:
    - cron: "0 16 * * 1-5" # 16:00 UTC on weekdays (9am in San Francisco during daylight time)
  workflow_dispatch:
    inputs:
      batch:
        description: 'Only send to this batch, e.g. "Fall 2025" (blank = everyone queued)'
        required: false
      limit:
        description: "Most emails to send this run (0 = up to DAILY_LIMIT)"
        required: false
        default: "0"
      dry_run:
        description: "Only list who would get an email"
        type: boolean
        default: false

concurrency:
  group: send # never run two sends at once
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 370 # GitHub's max; 100 emails x up to 180s apart is about 5h
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      FROM_NAME: ${{ secrets.FROM_NAME }}
      DAILY_LIMIT: ${{ secrets.DAILY_LIMIT || '40' }}
      MIN_DELAY: ${{ secrets.MIN_DELAY || '60' }}
      MAX_DELAY: ${{ secrets.MAX_DELAY || '180' }}
      REDACT_LOGS: "1" # logs of a public repo are public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write template.txt
        env:
          TEMPLATE: ${{ secrets.TEMPLATE }}
        run: |
          if [ -z "$TEMPLATE" ]; then echo "::error::Add your template.txt as the TEMPLATE secret"; exit 1; fi
          printf '%s\n' "$TEMPLATE" > template.txt

      - name: Check replies and bounces
        run: python outreach.py replies

      - name: Send
        env:
          BATCH: ${{ inputs.batch }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python outreach.py send --limit "$LIMIT" $DRY_RUN ${BATCH:+--batch "$BATCH"}

      - name: Status
        if: always()
        run: python outreach.py status | sed -n '1,/^$/p'
